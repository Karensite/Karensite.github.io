<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Chat</title>
    <style>
        :root { --p: #6c5ce7; --bg: #f0f2f5; --s: #dcf8c6; --r: #fff; --admin: #ffeaa7; }
        body { font-family: Tahoma, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; height: 100vh; }
        .app { width: 100%; max-width: 480px; background: #fff; height: 100%; display: flex; flex-direction: column; }
        .page { display: none; height: 100%; flex-direction: column; }
        .page.active { display: flex; }
        
        .auth { padding: 40px; text-align: center; margin: auto; width: 90%; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--p); color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px; font-weight: bold; }
        button.sec { background: #00b894; }
        
        .hdr { background: var(--p); color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .msgs { flex: 1; overflow-y: auto; padding: 15px; background: #e5ddd5; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px; border-radius: 10px; font-size: 14px; word-wrap: break-word; user-select: none; }
        .msg.sent { background: var(--s); align-self: flex-end; }
        .msg.rcv { background: var(--r); align-self: flex-start; }
        .msg.admin { background: var(--admin); align-self: flex-start; border: 2px solid #fdcb6e; } /* استایل پیام ادمین */
        
        .inp-area { padding: 10px; background: #f0f0f0; display: flex; gap: 10px; align-items: center; }
        .ibtn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #fff; cursor: pointer; font-size: 20px; }
        
        .side { background: #fff; border-bottom: 1px solid #ddd; max-height: 200px; overflow-y: auto; padding: 10px; }
        .ct { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .ct:hover { background: #f5f5f5; }
        .stor-info { font-size: 10px; color: #666; text-align: center; background: #eee; padding: 2px; }
    </style>
</head>
<body>

<!-- صفحه ورود -->
<div id="lp" class="page active">
    <div class="auth">
        <h2>ورود به Case Chat</h2>
        <input type="text" id="lu" placeholder="نام کاربری">
        <input type="password" id="lpw" placeholder="رمز عبور">
        <button onclick="login()">ورود</button>
        <p id="le" style="color:red;font-size:12px"></p>
        <hr>
        <h3>ثبت‌نام</h3>
        <input type="text" id="rn" placeholder="نام نمایشی">
        <input type="text" id="ru" placeholder="نام کاربری">
        <input type="password" id="rp" placeholder="رمز عبور">
        <button class="sec" onclick="reg()">ثبت‌نام</button>
    </div>
</div>

<!-- صفحه چت -->
<div id="cp" class="page">
    <div class="hdr">
        <span id="ht">چت عمومی</span>
        <button onclick="location.reload()" style="width:auto;padding:5px;background:#ff7675;border:none">خروج</button>
    </div>
    <div class="stor-info" id="si">وضعیت حافظه: متصل</div>
    <div class="side">
        <div class="ct" onclick="openChat('public')"><b>🌐 چت عمومی</b></div>
        <div id="cl"></div>
    </div>
    <div class="msgs" id="mc"></div>
    <div class="inp-area">
        <input type="text" id="mi" placeholder="پیام..." onkeypress="if(event.key==='Enter')sendTxt()" style="flex:1;padding:10px;border-radius:20px;border:1px solid #ddd">
        <button class="ibtn" onclick="sendTxt()" style="background:var(--p);color:#fff">➤</button>
    </div>
</div>

<script>
// ================= تنظیمات حیاتی (کلیدهای جدید) =================
const SK = '$2a$10$D7BwEyprqdToYeURLDW2D.ysb8/Bc8t3qAd82Ix/syg53aLUmzJoC'; 
let MK = '$2a$10$i65hmMqr/Bwjox8aODVMn.2a9i3a34SEqxkxcSk9FA21aAzELweRC'; 
let BI = '6aad59e4ac6210605adce854'; 
const AB = 'https://api.jsonbin.io/v3';
let AU = `${AB}/b/${BI}`;

let CU = null;
let CC = 'public';
let RI = null;
let isBusy = false; 

// ================= توابع پایه (همان نسخه اول) =================
async function getDB() {
    try {
        const r = await fetch(AU, { headers: { 'X-Master-Key': MK } });
        return (await r.json()).record || { users: [], messages: [] };
    } catch (e) { return null; }
}

async function saveDB(data) {
    try {
        await fetch(AU, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Secret-Key': SK }, body: JSON.stringify(data) });
        return true;
    } catch (e) { return false; }
}

// ================= سیستم هوشمند تعویض Bin =================
async function checkAndRotate() {
    try {
        const r = await fetch(AU, { method: 'HEAD', headers: { 'X-Master-Key': MK } });
        const size = parseInt(r.headers.get('content-length')) || 0;
        const kb = (size / 1024).toFixed(1);
        document.getElementById('si').innerText = `حافظه: ${kb} KB`;
        
        if (size > 400 * 1024) {
            document.getElementById('si').innerText = '⚠️ در حال ساخت حافظه جدید...';
            const nb = await fetch(`${AB}/b`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Secret-Key': SK },
                body: JSON.stringify({ users: [], messages: [] })
            });
            const nd = await nb.json();
            if (nd.metadata && nd.metadata.id) {
                BI = nd.metadata.id;
                AU = `${AB}/b/${BI}`;
                alert('✅ حافظه جدید ساخته شد! ادامه دهید.');
                loadMsgs();
            }
        }
    } catch (e) { console.error(e); }
}

// ================= احراز هویت =================
async function reg() {
    if(isBusy) return; isBusy = true;
    const n = document.getElementById('rn').value.trim();
    const u = document.getElementById('ru').value.trim().toLowerCase();
    const p = document.getElementById('rp').value;
    
    if(!n || !u || !p) { isBusy = false; return alert('همه فیلدها لازم است'); }
    
    let db = await getDB();
    if(!db) { isBusy = false; return alert('خطا در اتصال'); }
    if(db.users.find(x => x.username === u)) { isBusy = false; return alert('تکراری است'); }
    
    db.users.push({ name: n, username: u, password: p, contacts: [] });
    if(await saveDB(db)) {
        alert('ثبت‌نام شد!');
        document.getElementById('rn').value = ''; document.getElementById('ru').value = ''; document.getElementById('rp').value = '';
    } else { alert('خطا در ذخیره سازی'); }
    isBusy = false;
}

async function login() {
    if(isBusy) return; isBusy = true;
    const u = document.getElementById('lu').value.trim().toLowerCase();
    const p = document.getElementById('lpw').value;
    
    let db = await getDB();
    if(!db) { isBusy = false; return alert('خطا در اتصال'); }
    
    const f = db.users.find(x => x.username === u && x.password === p);
    if(f) {
        CU = f;
        document.getElementById('lp').classList.remove('active');
        document.getElementById('cp').classList.add('active');
        loadContacts();
        openChat('public');
        RI = setInterval(() => { loadMsgs(); checkAndRotate(); }, 3000);
    } else {
        document.getElementById('le').innerText = 'اشتباه است';
    }
    isBusy = false;
}

// ================= چت متنی =================
async function loadMsgs() {
    if(!CU) return;
    let db = await getDB();
    if(!db) return;
    
    const c = document.getElementById('mc');
    const ms = db.messages.filter(m => m.chatId === CC).slice(-50);
    
    c.innerHTML = '';
    ms.forEach(m => {
        const d = document.createElement('div');
        const isAdmin = m.sender === 'ADMIN_SYSTEM';
        
        // تعیین کلاس استایل (ادمین، ارسال شده، دریافت شده)
        let cls = 'msg ';
        if (isAdmin) cls += 'admin';
        else if (m.sender === CU.username) cls += 'sent';
        else cls += 'rcv';
        
        d.className = cls;
        
        // حذف با دابل کلیک (فقط برای پیام‌های خودمان)
        if(!isAdmin && m.sender === CU.username) {
            d.ondblclick = async () => {
                if(confirm('حذف پیام؟')) {
                    db.messages = db.messages.filter(x => x.id !== m.id);
                    await saveDB(db);
                    loadMsgs();
                }
            };
        }
        
        d.innerHTML = `<b>${m.senderName}</b><br>${m.content}<div style="font-size:10px;opacity:0.7">${m.time}</div>`;
        c.appendChild(d);
    });
    c.scrollTop = c.scrollHeight;
}

async function sendTxt() {
    if(isBusy) return; isBusy = true;
    const i = document.getElementById('mi');
    if(!i.value.trim()) { isBusy = false; return; }
    
    let db = await getDB();
    if(!db) { isBusy = false; return alert('خطا در اتصال'); }
    
    db.messages.push({
        id: Date.now(), sender: CU.username, senderName: CU.name,
        chatId: CC, content: i.value, type: 'text',
        time: new Date().toLocaleTimeString()
    });
    
    if(await saveDB(db)) {
        i.value = '';
        loadMsgs();
    } else { alert('خطا در ارسال'); }
    isBusy = false;
}

// ================= مخاطبین ساده =================
async function loadContacts() {
    let db = await getDB();
    const l = document.getElementById('cl');
    l.innerHTML = '';
    if(CU.contacts) {
        CU.contacts.forEach(c => {
            l.innerHTML += `<div class="ct" onclick="openChat('${c}')">👤 ${c}</div>`;
        });
    }
}

function openChat(id) {
    CC = id;
    document.getElementById('ht').innerText = id === 'public' ? 'چت عمومی' : id;
    loadMsgs();
}
</script>
</body>
</html>
