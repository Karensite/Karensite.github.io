<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Case</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root { --bg: #000; --panel: #111; --accent: #00ff88; --text: #eee; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; justify-content: center; position: relative; }
        
        .bg-anim { position: absolute; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%); }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: float 10s infinite alternate; }
        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, -30px); } }

        .app { width: 100%; max-width: 480px; background: rgba(17, 17, 17, 0.95); height: 100%; display: flex; flex-direction: column; backdrop-filter: blur(10px); position: relative; z-index: 1; border-left: 1px solid #333; border-right: 1px solid #333; }
        
        .page { display: none; height: 100%; flex-direction: column; }
        .page.active { display: flex; animation: fade 0.4s; }
        @keyframes fade { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .auth { padding: 40px; text-align: center; margin: auto; width: 90%; background: #1a1a1a; border-radius: 20px; border: 1px solid #333; box-shadow: 0 0 30px rgba(0,255,136,0.1); }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: white; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,136,0.2); }
        button { width: 100%; padding: 15px; background: var(--accent); color: black; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; transition: 0.2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,255,136,0.3); }

        .hdr { padding: 20px; background: #111; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .sidebar { background: #111; border-bottom: 1px solid #333; max-height: 250px; overflow-y: auto; padding: 10px; }
        .search-bar { display: flex; gap: 5px; margin-bottom: 10px; }
        .contact { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; border-radius: 8px; }
        .contact:hover { background: #222; }
        .avatar { width: 40px; height: 40px; background: #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: var(--accent); }

        .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #000; }
        .msg { max-width: 80%; padding: 12px 18px; border-radius: 18px; font-size: 14px; line-height: 1.5; position: relative; user-select: none; animation: popIn 0.3s; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .msg.sent { background: var(--accent); color: black; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.rcv { background: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .inp-area { padding: 15px; background: #111; display: flex; gap: 10px; border-top: 1px solid #333; }
        .inp-area input { margin: 0; border-radius: 25px; padding: 12px 20px; }
        .send-btn { width: 50px; margin: 0; border-radius: 50%; background: var(--accent); color: black; display: flex; justify-content: center; align-items: center; font-size: 20px; }

        .status-bar { font-size: 10px; color: #666; text-align: center; padding: 5px; background: #000; border-top: 1px solid #222; }
    </style>
</head>
<body>
    <div class="bg-anim">
        <div class="orb" style="width:200px;height:200px;background:#00ff88;top:10%;left:10%"></div>
        <div class="orb" style="width:150px;height:150px;background:#0088ff;bottom:10%;right:10%;animation-delay:-5s"></div>
    </div>

    <div class="app">
        <div id="lp" class="page active">
            <div class="auth">
                <h1 style="color:var(--accent);margin-bottom:5px">Chat Case</h1>
                <p style="color:#666;font-size:12px;margin-bottom:30px">پلتفرم ارتباطی امن و سریع</p>
                <input type="text" id="u" placeholder="نام کاربری (ID)">
                <input type="password" id="p" placeholder="رمز عبور">
                <button onclick="login()">ورود / ثبت‌نام</button>
                <p id="err" style="color:#ff4444;font-size:12px;min-height:20px"></p>
            </div>
        </div>

        <div id="cp" class="page">
            <div class="hdr">
                <span id="ht" style="font-weight:bold;color:var(--accent)">Chat Case</span>
                <button onclick="location.reload()" style="width:auto;padding:5px 10px;background:#333;color:white;border:none;border-radius:5px;font-size:12px">خروج</button>
            </div>
            
            <div class="sidebar">
                <div class="search-bar">
                    <input type="text" id="si" placeholder="سرچ ID کاربر یا نام گروه...">
                    <button onclick="search()" style="width:50px;margin:0;background:#333">🔍</button>
                </div>
                <div id="cl"></div>
            </div>

            <div class="msgs" id="mc">
                <div style="text-align:center;color:#444;margin-top:50px">یک مخاطب یا گروه انتخاب کنید</div>
            </div>

            <div class="inp-area">
                <input type="text" id="mi" placeholder="پیام..." onkeypress="if(event.key==='Enter')send()" disabled>
                <button class="send-btn" onclick="send()" id="sb" disabled>➤</button>
            </div>
            <div class="status-bar" id="st">حافظه مصرفی: محاسبه...</div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://lzlubkybrzkomjefqwxk.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6bHVia3licnprb21qZWZxd3hrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MjgyODIsImV4cCI6MjEwNTMwNDI4Mn0.txxWNKJfffkE7quUKJ4v2E6EiotRHFrWDRTKVa9TYPs'; 
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let me = null, target = null;

    async function login() {
        const u = document.getElementById('u').value.trim();
        const p = document.getElementById('p').value;
        if(!u || !p) return document.getElementById('err').innerText = 'همه فیلدها لازم است';
        
        // چک کردن مسدود بودن
        try {
            const { data: blocked } = await supabase.from('blocked_users').select('*').eq('username', u).single();
            if(blocked) return document.getElementById('err').innerText = 'شما توسط مدیر مسدود شده‌اید';
        } catch(e) {} 

        me = u;
        document.getElementById('lp').classList.remove('active');
        document.getElementById('cp').classList.add('active');
        checkStorage();
    }

    async function search() {
        const q = document.getElementById('si').value.trim();
        if(!q) return;
        const list = document.getElementById('cl');
        
        const { data } = await supabase.from('Karensite').select('id_from').eq('id_from', q).limit(1);
        if(data && data.length > 0) {
            list.innerHTML += `<div class="contact" onclick="openChat('${q}', 'private')"><div class="avatar">${q[0].toUpperCase()}</div><div>${q} (کاربر)</div></div>`;
        } else {
            list.innerHTML += `<div class="contact" onclick="openChat('${q}', 'group')"><div class="avatar">#</div><div>${q} (گروه/کانال)</div></div>`;
        }
    }

    function openChat(id, type) {
        target = { id, type };
        document.getElementById('ht').innerText = id;
        document.getElementById('mi').disabled = false;
        document.getElementById('sb').disabled = false;
        loadMessages();
    }

    async function loadMessages() {
        if(!target) return;
        const { data } = await supabase.from('Karensite').select('*').or(`and(id_from.eq.${me},id_to.eq.${target.id}),and(id_from.eq.${target.id},id_to.eq.${me})`).order('created_at', {ascending:true}).limit(50);
        
        const c = document.getElementById('mc');
        c.innerHTML = '';
        data.forEach(m => {
            const d = document.createElement('div');
            d.className = `msg ${m.id_from === me ? 'sent' : 'rcv'}`;
            d.innerText = m.content;
            
            // حذف با نگه داشتن انگشت (Long Press) فقط برای پیام‌های خودمان
            if(m.id_from === me) {
                let timer;
                d.addEventListener('touchstart', () => { timer = setTimeout(() => deleteMsg(m.id), 800); });
                d.addEventListener('mousedown', () => { timer = setTimeout(() => deleteMsg(m.id), 800); });
                d.addEventListener('touchend', () => clearTimeout(timer));
                d.addEventListener('mouseup', () => clearTimeout(timer));
            }
            c.appendChild(d);
        });
        c.scrollTop = c.scrollHeight;
    }

    async function send() {
        const i = document.getElementById('mi');
        if(!i.value.trim() || !target) return;
        await supabase.from('Karensite').insert([{ id_from: me, id_to: target.id, content: i.value, type: target.type }]);
        i.value = '';
        loadMessages();
    }

    async function deleteMsg(id) {
        if(confirm('پیام حذف شود؟')) {
            await supabase.from('Karensite').delete().eq('id', id);
            loadMessages();
        }
    }

    async function checkStorage() {
        const { count } = await supabase.from('Karensite').select('*', { count: 'exact', head: true });
        const usedMB = ((count * 100) / (1024 * 1024)).toFixed(2);
        document.getElementById('st').innerText = `پیام‌ها: ${count} | حافظه تخمینی: ${usedMB} MB`;
    }
</script>
</body>
</html>
