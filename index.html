<!DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Admin Dashboard Pro</title> <style> :root { --dark: #2d3436; --panel: #353b48; --accent: #00cec9; --danger: #ff7675; --success: #00b894; } body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--dark); color: white; margin: 0; padding: 20px; min-height: 100vh; } .dashboard { max-width: 1000px; margin: 0 auto; } .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #555; } .header h1 { margin: 0; color: var(--accent); font-size: 24px; } .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; } .stat-card { background: var(--panel); padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2); } .stat-number { font-size: 32px; font-weight: bold; color: var(--accent); margin: 10px 0; } .section { background: var(--panel); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); } .section h2 { margin-top: 0; color: #dfe6e9; border-bottom: 1px solid #555; padding-bottom: 10px; } .user-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #444; transition: 0.2s; } .user-row:hover { background: #404852; } .user-info b { display: block; font-size: 16px; } .user-info small { color: #aaa; font-size: 12px; } .actions { display: flex; gap: 10px; } button { padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; } button:hover { opacity: 0.9; transform: scale(1.05); } .btn-view { background: #0984e3; color: white; } .btn-block { background: var(--danger); color: white; } .btn-unblock { background: var(--success); color: white; } .btn-delete { background: #636e72; color: white; } .btn-chat { background: #fdcb6e; color: #2d3436; } /* Modals */ .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: none; justify-content: center; align-items: center; } .modal-box { background: var(--panel); padding: 30px; border-radius: 15px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); } .modal-box h3 { margin-top: 0; color: var(--accent); } .modal-box input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #555; background: #2d3436; color: white; box-sizing: border-box; } /* Chat Viewer */ #chat-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 2000; padding: 20px; box-sizing: border-box; overflow-y: auto; } .viewer-header { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; } .msg-log { background: var(--panel); padding: 15px; margin-bottom: 10px; border-radius: 8px; border-right: 4px solid var(--accent); } .msg-log.admin-msg { border-right-color: #fdcb6e; background: #404852; } .refresh-btn { background: var(--success); color: white; width: 100%; padding: 15px; font-size: 16px; margin-bottom: 20px; border-radius: 10px; } .create-user-btn { background: var(--accent); color: #2d3436; width: 100%; padding: 15px; font-size: 16px; margin-bottom: 20px; border-radius: 10px; font-weight: bold; } </style> </head> <body> <div class="dashboard"> <div class="header"> <h1>👮‍♂️ پنل مدیریت حرفه‌ای</h1> <div style="font-size:12px; color:#aaa;">Last Update: <span id="last-update">-</span></div> </div> <button onclick="loadData()" class="refresh-btn">🔄 بروزرسانی داده‌ها</button> <button onclick="showCreateUserModal()" class="create-user-btn">➕ ساخت حساب کاربری جدید</button> <div class="stats-grid"> <div class="stat-card"> <div>تعداد کاربران</div> <div class="stat-number" id="total-users">0</div> </div> <div class="stat-card"> <div>پیام‌های ارسالی</div> <div class="stat-number" id="total-msgs">0</div> </div> <div class="stat-card"> <div>گزارش‌های فعال</div> <div class="stat-number" id="total-reports" style="color:var(--danger)">0</div> </div> </div> <div class="section"> <h2>👥 مدیریت کاربران</h2> <div style="margin-bottom:15px;"> <input type="text" id="search-admin" placeholder="جستجوی کاربر..." onkeyup="filterUsers()" style="width:100%; padding:10px; border-radius:5px; border:none; background:#2d3436; color:white;"> </div> <div id="users-list"></div> </div> <div class="section"> <h2>🚩 گزارش‌های کاربران</h2> <div id="reports-list"></div> </div> </div> <!-- مودال ساخت کاربر --> <div id="create-user-modal" class="modal-overlay"> <div class="modal-box"> <h3>ساخت حساب جدید</h3> <input type="text" id="new-u-name" placeholder="نام نمایشی"> <input type="text" id="new-u-user" placeholder="نام کاربری (انگلیسی)"> <input type="password" id="new-u-pass" placeholder="رمز عبور"> <button onclick="createNewUser()" style="width:100%; background:var(--accent); color:#2d3436; margin-top:10px;">ساختن</button> <button onclick="closeModals()" style="width:100%; background:#636e72; color:white; margin-top:5px;">لغو</button> </div> </div> <!-- مودال چت ادمین --> <div id="chat-viewer"> <div class="viewer-header"> <h2 id="viewer-title" style="color:var(--accent)">چت با کاربر</h2> <div style="display:flex; gap:10px;"> <button onclick="toggleChatTarget()" id="chat-target-btn" style="background:#fdcb6e; color:#2d3436;">تغییر به: چت عمومی</button> <button onclick="document.getElementById('chat-viewer').style.display='none'" class="btn-delete" style="font-size:16px; padding:10px 20px;">بستن</button> </div> </div> <div id="viewer-messages" style="margin-bottom:20px;"></div> <div style="position:fixed; bottom:20px; left:20px; right:20px; display:flex; gap:10px;"> <input type="text" id="admin-msg-input" placeholder="پیام خود را بنویسید..." style="flex:1; padding:15px; border-radius:10px; border:none; background:var(--panel); color:white;"> <button onclick="sendAdminMessage()" style="padding:15px 30px; background:var(--accent); color:#2d3436; border-radius:10px; border:none; font-weight:bold;">ارسال</button> </div> </div> <script> const BIN_ID = '6aad59e4ac6210605adce854'; const MASTER_KEY = '$2a$10$B2vErPUhRhSPVpQSRTxfeOrnuHZHTeFrPN4Q32Tlu6AMmQXdxMNrm'; const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`; let allUsers = []; let currentChatUser = null; // اگر null باشد یعنی چت عمومی است let chatInterval; async function loadData() { document.querySelector('.refresh-btn').innerText = '⏳ در حال دریافت...'; try { const res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } }); const data = (await res.json()).record || { users: [], messages: [], reports: [], groups: [] }; allUsers = data.users || []; const messages = data.messages || []; const reports = data.reports || []; document.getElementById('total-users').innerText = allUsers.length; document.getElementById('total-msgs').innerText = messages.length; document.getElementById('total-reports').innerText = reports.length; document.getElementById('last-update').innerText = new Date().toLocaleTimeString('fa-IR'); renderUsers(allUsers); renderReports(reports); document.querySelector('.refresh-btn').innerText = '🔄 بروزرسانی داده‌ها'; } catch (e) { alert('خطا در اتصال به دیتابیس'); } } function renderUsers(users) { const uList = document.getElementById('users-list'); uList.innerHTML = ''; if(users.length === 0) { uList.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">کاربری یافت نشد</div>'; return; } users.forEach(u => { uList.innerHTML += ` <div class="user-row"> <div class="user-info"> <b>${u.name}</b> <small>@${u.username} | ${u.isBlocked ? '🚫 مسدود' : '✅ فعال'}</small> </div> <div class="actions"> <button class="btn-chat" onclick="openAdminChat('${u.username}')">💬 چت</button> <button class="${u.isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlock('${u.username}', ${!u.isBlocked})"> ${u.isBlocked ? 'رفع انسداد' : 'مسدود کردن'} </button> <button class="btn-delete" onclick="deleteUser('${u.username}')">🗑 حذف</button> </div> </div> `; }); } function filterUsers() { const query = document.getElementById('search-admin').value.toLowerCase(); const filtered = allUsers.filter(u => u.username.includes(query) || u.name.includes(query)); renderUsers(filtered); } function renderReports(reports) { const rList = document.getElementById('reports-list'); rList.innerHTML = ''; if(!reports || reports.length === 0) { rList.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">گزارشی ثبت نشده است</div>'; return; } [...reports].reverse().forEach(r => { rList.innerHTML += ` <div style="padding:15px; border-bottom:1px solid #444; background:#2d3436; margin-bottom:10px; border-radius:8px;"> <b style="color:#fdcb6e">${r.user}</b>: ${r.text} <small>(${r.time})</small> </div> `; }); } // ================= ساخت کاربر جدید ================= function showCreateUserModal() { document.getElementById('create-user-modal').style.display = 'flex'; } function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); document.getElementById('chat-viewer').style.display = 'none'; clearInterval(chatInterval); } async function createNewUser() { const name = document.getElementById('new-u-name').value; const user = document.getElementById('new-u-user').value.toLowerCase(); const pass = document.getElementById('new-u-pass').value; if(!name || !user || !pass) return alert('همه فیلدها لازم است'); const res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } }); const data = (await res.json()).record; if(data.users.find(u => u.username === user)) return alert('نام کاربری تکراری است'); data.users.push({ name, username: user, password: pass, contacts: [], isBlocked: false }); await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY }, body: JSON.stringify(data) }); alert('کاربر ساخته شد!'); closeModals(); loadData(); } // ================= چت ادمین ================= async function openAdminChat(username) { currentChatUser = username; document.getElementById('chat-viewer').style.display = 'block'; document.getElementById('viewer-title').innerText = `چت با: ${username}`; document.getElementById('chat-target-btn').innerText = 'تغییر به: چت عمومی'; loadAdminMessages(); chatInterval = setInterval(loadAdminMessages, 2000); } function toggleChatTarget() { if(currentChatUser) { currentChatUser = null; document.getElementById('viewer-title').innerText = 'چت عمومی'; document.getElementById('chat-target-btn').innerText = 'تغییر به: چت خصوصی'; } else { alert('لطفاً ابتدا از لیست کاربران یک نفر را برای چت خصوصی انتخاب کنید.'); } loadAdminMessages(); } async function loadAdminMessages() { const res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } }); const data = (await res.json()).record; const container = document.getElementById('viewer-messages'); let msgs; if(currentChatUser) { msgs = data.messages.filter(m => (m.sender === 'ADMIN_SYSTEM' && m.receiver === currentChatUser) || (m.sender === currentChatUser && m.receiver === 'ADMIN_SYSTEM')); } else { msgs = data.messages.filter(m => m.chatId === 'public'); } container.innerHTML = ''; msgs.slice(-50).forEach(m => { const isAdmin = m.sender === 'ADMIN_SYSTEM'; container.innerHTML += ` <div class="msg-log ${isAdmin ? 'admin-msg' : ''}"> <b>${m.senderName}</b>: ${m.content} <small>(${m.time})</small> </div> `; }); container.scrollTop = container.scrollHeight; } async function sendAdminMessage() { const input = document.getElementById('admin-msg-input'); const text = input.value.trim(); if(!text) return; const res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } }); const data = (await res.json()).record; data.messages.push({ id: Date.now(), sender: 'ADMIN_SYSTEM', senderName: 'مدیر سیستم 👮‍♂️', receiver: currentChatUser, chatId: currentChatUser ? 'private' : 'public', content: text, type: 'text', time: new Date().toLocaleTimeString('fa-IR') }); await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY }, body: JSON.stringify(data) }); input.value = ''; loadAdminMessages(); } async function deleteUser(username) { if(!confirm(`حذف کامل ${username}؟`)) return; const res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } }); const data = (await res.json()).record; data.users = data.users.filter(u => u.username !== username); data.messages = data.messages.filter(m => m.sender !== username); await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY }, body: JSON.stringify(data) }); loadData(); } async function toggleBlock(username, status) { const res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } }); const data = (await res.json()).record; data.users.find(u => u.username === username).isBlocked = status; await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY }, body: JSON.stringify(data) }); loadData(); } loadData(); </script> </body> </html>
