<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Chat</title>
    <style>
        :root { --primary: #6c5ce7; --bg: #dfe6e9; }
        body { font-family: Tahoma, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; height: 100vh; }
        .app { width: 100%; max-width: 480px; background: white; height: 100%; display: flex; flex-direction: column; }
        .page { display: none; height: 100%; flex-direction: column; }
        .page.active { display: flex; }
        
        .auth-box { padding: 40px; text-align: center; margin: auto; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 95%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
        
        .header { background: var(--primary); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; background: #f0f2f5; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px; border-radius: 10px; position: relative; font-size: 14px; user-select: none; }
        .msg.sent { background: #dcf8c6; align-self: flex-end; }
        .msg.received { background: white; align-self: flex-start; }
        .msg img, .msg video { max-width: 100%; border-radius: 5px; }
        
        .input-area { padding: 10px; background: #f0f0f0; display: flex; gap: 10px; align-items: center; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #fff; cursor: pointer; font-size: 20px; }
        .voice-btn.recording { background: #ff7675; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { transform: scale(1.1); } }
        
        .sidebar { background: white; border-bottom: 1px solid #ddd; max-height: 150px; overflow-y: auto; padding: 10px; }
        .contact { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        
        /* Delete Modal */
        .delete-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; display: none; justify-content: center; align-items: center; }
        .delete-box { background: white; padding: 20px; border-radius: 10px; text-align: center; }
        
        /* Report Modal */
        .report-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 150; display: none; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="login-page" class="page active">
        <div class="auth-box">
            <h2>ورود به Case Chat</h2>
            <input type="text" id="l-user" placeholder="نام کاربری">
            <input type="password" id="l-pass" placeholder="رمز عبور">
            <button onclick="login()">ورود</button>
            <p id="l-error" style="color:red; font-size:12px;"></p>
            <hr>
            <h3>ثبت‌نام</h3>
            <input type="text" id="r-name" placeholder="نام نمایشی">
            <input type="text" id="r-user" placeholder="نام کاربری">
            <input type="password" id="r-pass" placeholder="رمز عبور">
            <button onclick="register()" style="background:#00b894;">ثبت‌نام</button>
        </div>
    </div>

    <div id="chat-page" class="page">
        <div class="header">
            <span id="my-name">کاربر</span>
            <div>
                <button onclick="showReport()" style="width:auto; padding:5px 10px; background:transparent; border:1px solid white;">🚩 گزارش</button>
                <button onclick="logout()" style="width:auto; padding:5px 10px; background:#d9534f; border:none;">خروج</button>
            </div>
        </div>
        <div class="sidebar">
            <div class="contact" onclick="openChat('public')"><b>🌐 چت عمومی</b></div>
            <div style="padding:5px; display:flex; gap:5px;">
                <input type="text" id="search-user" placeholder="افزودن مخاطب..." style="margin:0; width:70%;">
                <button onclick="addContact()" style="width:25%;">+</button>
            </div>
            <div id="contacts-list"></div>
        </div>
        <div class="messages" id="msg-container"></div>
        <div class="input-area">
            <input type="file" id="file-input" style="display:none;" onchange="prepareFile()">
            <button class="icon-btn" onclick="document.getElementById('file-input').click()">📎</button>
            <button class="icon-btn voice-btn" id="voice-btn" onclick="toggleVoice()">🎤</button>
            <input type="text" id="msg-input" placeholder="پیام..." onkeypress="if(event.key==='Enter') sendText()">
            <button class="icon-btn" onclick="sendText()" style="background:var(--primary); color:white;">➤</button>
        </div>
    </div>

    <!-- مودال گزارش -->
    <div id="report-modal" class="report-modal">
        <h2>ثبت گزارش 🚩</h2>
        <textarea id="report-text" style="width:100%; height:150px; padding:10px; margin:10px 0;" placeholder="مشکل را بنویسید..."></textarea>
        <button onclick="submitReport()">ارسال</button>
        <button onclick="document.getElementById('report-modal').style.display='none'" style="background:#b2bec3; margin-top:10px;">لغو</button>
    </div>

    <!-- منوی حذف -->
    <div id="delete-overlay" class="delete-overlay">
        <div class="delete-box">
            <h3>حذف پیام؟</h3>
            <button onclick="confirmDelete()" style="background:#ff7675;">بله</button>
            <button onclick="cancelDelete()" style="background:#b2bec3; margin-top:5px;">لغو</button>
        </div>
    </div>

    <script>
        const BIN_ID = '6aad2b9dac6210605adc3af4'; 
        const MASTER_KEY = '$2a$10$B2vErPUhRhSPVpQSRTxfeOrnuHZHTeFrPN4Q32Tlu6AMmQXdxMNrm';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        let currentUser = null, currentChat = 'public', refreshInterval, mediaRecorder, audioChunks = [], recordingTime, timerInterval, selectedFile, msgToDelete, longPressTimer;

        async function getData() {
            try { const res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } }); return (await res.json()).record || { users: [], messages: [], reports: [] }; } 
            catch (e) { return { users: [], messages: [], reports: [] }; }
        }
        async function saveData(data) { await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY }, body: JSON.stringify(data) }); }

        async function register() {
            const name = document.getElementById('r-name').value, user = document.getElementById('r-user').value.toLowerCase(), pass = document.getElementById('r-pass').value;
            if(!name || !user || !pass) return alert('همه فیلدها لازم است');
            const db = await getData();
            if(db.users.find(u => u.username === user)) return alert('نام کاربری تکراری است');
            db.users.push({ name, username: user, password: pass, contacts: [], isBlocked: false });
            await saveData(db); alert('ثبت‌نام شد!');
        }

        async function login() {
            const user = document.getElementById('l-user').value.toLowerCase(), pass = document.getElementById('l-pass').value;
            const db = await getData();
            const found = db.users.find(u => u.username === user && u.password === pass);
            if(found) {
                if(found.isBlocked) return alert('حساب شما مسدود شده است.');
                currentUser = found;
                document.getElementById('login-page').classList.remove('active');
                document.getElementById('chat-page').classList.add('active');
                document.getElementById('my-name').innerText = found.name;
                loadContacts(); openChat('public');
                refreshInterval = setInterval(loadMessages, 2000);
            } else { document.getElementById('l-error').innerText = 'اشتباه است'; }
        }

        function logout() { location.reload(); }

        async function loadMessages() {
            const db = await getData();
            const container = document.getElementById('msg-container');
            const msgs = db.messages.filter(m => {
                if(currentChat === 'public') return m.channel === 'public';
                return (m.sender === currentUser.username && m.receiver === currentChat) || (m.sender === currentChat && m.receiver === currentUser.username);
            });
            container.innerHTML = '';
            msgs.forEach(msg => {
                const div = document.createElement('div');
                div.className = `msg ${msg.sender === currentUser.username ? 'sent' : 'received'}`;
                div.onmousedown = div.ontouchstart = () => startLongPress(msg.id, msg.sender);
                div.onmouseup = div.ontouchend = cancelLongPress;
                let content = msg.content;
                if(msg.type === 'image') content = `<img src="${msg.content}">`;
                if(msg.type === 'video') content = `<video src="${msg.content}" controls></video>`;
                if(msg.type === 'audio') content = `<audio src="${msg.content}" controls></audio>`;
                div.innerHTML = `${content}<div style="font-size:10px; opacity:0.7">${msg.time}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendText() { const input = document.getElementById('msg-input'); if(!input.value.trim()) return; await saveMessage(input.value, 'text'); input.value = ''; }
        async function saveMessage(content, type, size='') {
            const db = await getData();
            db.messages.push({ id: Date.now(), sender: currentUser.username, receiver: currentChat==='public'?null:currentChat, channel: currentChat, content, type, size, time: new Date().toLocaleTimeString() });
            await saveData(db); loadMessages();
        }

        function prepareFile() {
            const file = document.getElementById('file-input').files[0]; if(!file) return;
            if(file.size > 5*1024*1024) return alert('فایل بزرگ است');
            const reader = new FileReader();
            reader.onload = (e) => saveMessage(e.target.result, file.type.startsWith('image')?'image':'video', (file.size/1024).toFixed(1)+'KB');
            reader.readAsDataURL(file);
        }

        function toggleVoice() {
            const btn = document.getElementById('voice-btn');
            if(btn.classList.contains('recording')) {
                mediaRecorder.stop(); clearInterval(timerInterval);
                btn.classList.remove('recording'); btn.innerText = '🎤';
            } else {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream); mediaRecorder.start(); audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    btn.classList.add('recording'); recordingTime = 0;
                    timerInterval = setInterval(() => { recordingTime++; btn.innerText = `⏱ ${recordingTime}s`; }, 1000);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.onload = (e) => saveMessage(e.target.result, 'audio', (blob.size/1024).toFixed(1)+'KB');
                        reader.readAsDataURL(blob);
                    };
                });
            }
        }

        function startLongPress(id, sender) { if(sender !== currentUser.username) return; longPressTimer = setTimeout(() => { msgToDelete = id; document.getElementById('delete-overlay').style.display = 'flex'; }, 800); }
        function cancelLongPress() { clearTimeout(longPressTimer); }
        async function confirmDelete() { if(!msgToDelete) return; const db = await getData(); db.messages = db.messages.filter(m => m.id !== msgToDelete); await saveData(db); document.getElementById('delete-overlay').style.display = 'none'; loadMessages(); }
        function cancelDelete() { document.getElementById('delete-overlay').style.display = 'none'; }

        function showReport() { document.getElementById('report-modal').style.display = 'block'; }
        async function submitReport() {
            const text = document.getElementById('report-text').value; if(!text) return;
            const db = await getData(); if(!db.reports) db.reports = [];
            db.reports.push({ user: currentUser.username, text, time: new Date().toLocaleString() });
            await saveData(db); alert('گزارش ثبت شد'); document.getElementById('report-modal').style.display = 'none';
        }

        async function addContact() {
            const u = document.getElementById('search-user').value.toLowerCase();
            const db = await getData();
            if(db.users.find(x => x.username === u) && u !== currentUser.username) {
                if(!currentUser.contacts.includes(u)) {
                    currentUser.contacts.push(u);
                    const idx = db.users.findIndex(x => x.username === currentUser.username);
                    db.users[idx] = currentUser; await saveData(db); loadContacts();
                }
            } else { alert('یافت نشد'); }
        }
        function loadContacts() {
            const list = document.getElementById('contacts-list'); list.innerHTML = '';
            currentUser.contacts.forEach(c => { list.innerHTML += `<div class="contact" onclick="openChat('${c}')">👤 ${c}</div>`; });
        }
        function openChat(id) { currentChat = id; loadMessages(); }
    </script>
</body>
  </html>
