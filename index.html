<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت با هوش مصنوعی کارن</title>

    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #chat {
            width: 100%;
            max-width: 600px;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 8px;
            background: #222;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .msg {
            margin: 5px 0;
        }
        .user {
            color: #4fc3f7;
        }
        .ai {
            color: #81c784;
        }
        #input-area {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #000;
            color: #eee;
        }
        button {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            background: #4fc3f7;
            color: #000;
            cursor: pointer;
        }
        button:disabled {
            background: #777;
            cursor: default;
        }
    </style>
</head>
<body>
    <h1>چت با هوش مصنوعی کارن</h1>

    <div id="chat"></div>

    <div id="input-area">
        <input id="userInput" type="text" placeholder="پیام‌ت رو بنویس...">
        <button id="sendBtn">ارسال</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
