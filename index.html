<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>Karen AI – Case.1</title>
  <script src="https://cdn.jsdelivr.net/npm/webllm/dist/webllm.min.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 420px;
      background: #020617;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow: hidden;
      border: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
    }
    .chat-header-title {
      font-size: 14px;
      font-weight: 600;
    }
    .chat-header-sub {
      font-size: 11px;
      color: #9ca3af;
    }
    .chat-badge {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #22c55e1a;
      color: #22c55e;
      border: 1px solid #22c55e33;
    }
    #chat {
      height: 320px;
      padding: 12px 16px;
      overflow-y: auto;
      font-size: 13px;
    }
    .msg {
      margin-bottom: 10px;
      display: flex;
      gap: 8px;
    }
    .msg-user {
      justify-content: flex-end;
    }
    .msg-ai {
      justify-content: flex-start;
    }
    .bubble {
      max-width: 80%;
      padding: 8px 10px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .bubble-user {
      background: #22c55e;
      color: #022c22;
      border-bottom-right-radius: 2px;
    }
    .bubble-ai {
      background: #111827;
      border-bottom-left-radius: 2px;
      border: 1px solid #1f2937;
    }
    .msg-label {
      font-size: 10px;
      color: #9ca3af;
      margin-bottom: 2px;
    }
    .input-area {
      padding: 10px 12px;
      border-top: 1px solid #1f2937;
      display: flex;
      gap: 8px;
      background: #020617;
    }
    #msg {
      flex: 1;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
    }
    #msg::placeholder {
      color: #6b7280;
    }
    .send-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #022c22;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .send-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .status-bar {
      font-size: 10px;
      padding: 4px 12px 8px;
      color: #6b7280;
      border-top: 1px solid #111827;
      background: #020617;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div>
        <div class="chat-header-title">Karen AI – Case.1</div>
        <div class="chat-header-sub">هوش مصنوعی Case، همکار همیشه‌آنلاینِ تو (بدون کلید)</div>
      </div>
      <div class="chat-badge">Case.1 • Local LLM</div>
    </div>

    <div id="chat"></div>

    <div class="input-area">
      <input id="msg" type="text" placeholder="هرچی دوست داری بپرس…" />
      <button id="sendBtn" class="send-btn" onclick="sendMsg()">ارسال</button>
    </div>
    <div id="status" class="status-bar">در حال آماده‌سازی مدل Case.1…</div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    const statusBar = document.getElementById("status");

    // حافظهٔ دائمی داخل مرورگر (localStorage)
    const MEMORY_KEY = "karen_case_memory_v1";
    let memory = JSON.parse(localStorage.getItem(MEMORY_KEY) || "[]");

    function saveMemory() {
      localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
    }

    function addMessage(text, sender = "user") {
      const row = document.createElement("div");
      row.className = "msg " + (sender === "ai" ? "msg-ai" : "msg-user");

      const wrapper = document.createElement("div");
      const label = document.createElement("div");
      label.className = "msg-label";
      label.textContent = sender === "ai" ? "Case.1 • هوش مصنوعی" : "شما";

      const bubble = document.createElement("div");
      bubble.className = "bubble " + (sender === "ai" ? "bubble-ai" : "bubble-user");
      bubble.textContent = text;

      wrapper.appendChild(label);
      wrapper.appendChild(bubble);
      row.appendChild(wrapper);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    // بارگذاری مدل قوی‌تر WebLLM (بدون کلید)
    const engine = new webllm.LLMEngine();

    async function initModel() {
      try {
        statusBar.textContent = "در حال بارگذاری مدل Case.1 (ممکنه چند ثانیه طول بکشه)…";
        // مدل نمونه؛ در عمل باید یکی از مدل‌های پشتیبانی‌شدهٔ WebLLM باشه
        await engine.loadModel("qwen2.5-1.5b-instruct-q4f16_1-MLC");
        statusBar.textContent = "مدل Case.1 آماده است. هرچی دوست داری بپرس.";
        addMessage("سلام، من Case هستم، مدل Case.1. همکار هوش مصنوعی تو هستم. هر سؤالی داشتی، بپرس.", "ai");
      } catch (e) {
        statusBar.textContent = "خطا در بارگذاری مدل. مطمئن شو اینترنتت روشنه (برای دانلود خود مدل).";
        addMessage("فعلاً در بارگذاری مدل مشکل پیش اومده. بعداً دوباره امتحان کن.", "ai");
      }
    }

    initModel();

    async function sendMsg() {
      const text = msg.value.trim();
      if (!text) return;
      addMessage(text, "user");
      msg.value = "";
      msg.focus();

      // ذخیره در حافظهٔ دائمی
      memory.push({ role: "user", content: text });
      saveMemory();

      sendBtn.disabled = true;
      statusBar.textContent = "Case.1 در حال فکر کردن…";

      try {
        const messages = [
          {
            role: "system",
            content:
              "تو یک هوش مصنوعی حرفه‌ای به نام Case هستی، مدل Case.1. " +
              "همکار Karen هستی، همیشه مؤدب، دقیق، و واضح جواب می‌دی. " +
              "از حافظهٔ مکالمه برای فهم بهتر استفاده کن. وانمود نکن به اینترنت وصل هستی؛ " +
              "فقط با دانسته‌های خودت جواب بده."
          },
          ...memory,
          { role: "user", content: text }
        ];

        const reply = await engine.chat.completions.create({ messages });
        const answer = reply.choices[0].message.content;

        addMessage(answer, "ai");

        memory.push({ role: "assistant", content: answer });
        saveMemory();

        statusBar.textContent = "مدل Case.1 آمادهٔ سؤال بعدی است.";
      } catch (e) {
        addMessage("در پردازش پاسخ مشکل پیش اومد. بعداً دوباره امتحان کن.", "ai");
        statusBar.textContent = "خطا در پاسخ‌دهی.";
      } finally {
        sendBtn.disabled = false;
      }
    }

    // ارسال با Enter
    msg.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMsg();
    });
  </script>
</body>
</html>
