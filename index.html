<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Case Pro</title>
    <style>
        :root { --bg: #000; --panel: #111; --accent: #00ff88; --text: #eee; --border: #333; --voice: #ff4444; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; justify-content: center; }
        
        .app { width: 100%; max-width: 480px; background: var(--panel); height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1; }
        
        .page { display: none; height: 100%; flex-direction: column; animation: fade 0.3s; }
        .page.active { display: flex; }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .center-box { padding: 30px; text-align: center; margin: auto; width: 90%; background: #1a1a1a; border-radius: 20px; border: 1px solid var(--border); }
        input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--border); background: #000; color: white; transition: 0.3s; }
        input:focus { border-color: var(--accent); }
        button { width: 100%; padding: 14px; background: var(--accent); color: black; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        button.sec { background: #333; color: white; }
        
        .hdr { padding: 15px; background: #161616; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .hdr-title { font-weight: bold; color: var(--accent); font-size: 18px; }
        .icon-btn { background: none; border: none; color: white; font-size: 20px; width: auto; padding: 5px; margin: 0; }

        .sidebar { background: #111; border-bottom: 1px solid var(--border); max-height: 250px; overflow-y: auto; }
        .search-area { padding: 10px; display: flex; gap: 5px; }
        .list-item { padding: 12px 15px; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .list-item:hover { background: #222; }
        .avatar { width: 40px; height: 40px; background: #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: var(--accent); }
        .info h4 { margin: 0; font-size: 15px; color: white; }
        .info p { margin: 2px 0 0; font-size: 12px; color: #888; }

        .msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #000; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; position: relative; animation: popIn 0.3s; user-select: none; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .msg.sent { background: var(--accent); color: black; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.rcv { background: #222; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-sender { font-size: 11px; opacity: 0.7; margin-bottom: 4px; display: block; }

        .inp-area { padding: 12px; background: #161616; display: flex; gap: 10px; border-top: 1px solid var(--border); align-items: center; }
        .inp-area input { margin: 0; border-radius: 25px; padding: 12px 18px; flex: 1; }
        .action-btn { width: 45px; height: 45px; border-radius: 50%; margin: 0; display: flex; justify-content: center; align-items: center; font-size: 18px; background: #333; color: white; border: none; cursor: pointer; }
        .voice-btn.recording { background: var(--voice); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; border: 1px solid var(--border); text-align: center; }
        .link-box { background: #000; padding: 10px; border-radius: 8px; margin: 10px 0; word-break: break-all; font-size: 12px; color: var(--accent); border: 1px dashed #444; }
        
        .voice-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 15px; color: white; display: none; z-index: 200; text-align: center; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Login Page -->
        <div id="lp" class="page active">
            <div class="center-box">
                <h1 style="color:var(--accent)">Chat Case</h1>
                <p style="color:#666;font-size:12px">نسخه پیشرفته با ویس و لینک</p>
                <input type="text" id="lu" placeholder="نام کاربری">
                <input type="password" id="lpw" placeholder="رمز عبور">
                <button onclick="login()">ورود به حساب</button>
                <p id="le" style="color:red;font-size:12px;margin-top:10px"></p>
            </div>
        </div>

        <!-- Main Chat Page -->
        <div id="cp" class="page">
            <div class="hdr">
                <span class="hdr-title" id="ht">لیست گفتگوها</span>
                <div>
                    <button class="icon-btn" onclick="showAccount()">👤</button>
                    <button class="icon-btn" onclick="location.reload()">🚪</button>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="search-area">
                    <input type="text" id="si" placeholder="سرچ کاربر یا #ساخت گروه...">
                    <button onclick="handleSearch()" style="width:50px;margin:0;background:#333">🔍</button>
                </div>
                <div id="cl"></div>
            </div>

            <div class="msgs" id="mc">
                <div style="text-align:center;color:#444;margin-top:50px">یک گفتگو را انتخاب کنید</div>
            </div>

            <div class="inp-area">
                <button class="action-btn voice-btn" id="vb" onclick="toggleVoice()">🎙️</button>
                <input type="text" id="mi" placeholder="پیام..." onkeypress="if(event.key==='Enter')send()" disabled>
                <button class="action-btn" onclick="send()" id="sb" disabled style="background:var(--accent);color:black">➤</button>
            </div>
        </div>

        <!-- Account Page -->
        <div id="ap" class="page">
            <div class="hdr">
                <button class="icon-btn" onclick="backToChat()">➡️ بازگشت</button>
                <span class="hdr-title">حساب کاربری</span>
            </div>
            <div class="center-box" style="margin-top:20px">
                <div class="avatar" style="width:80px;height:80px;margin:0 auto 20px;font-size:30px" id="acc-avatar"></div>
                <h3 id="acc-name" style="color:white"></h3>
                <hr style="border-color:#333;margin:20px 0">
                <button class="danger" onclick="clearContacts()" style="background:#ff4444;color:white">پاک کردن لیست مخاطبین</button>
                <button class="sec" onclick="logout()" style="margin-top:20px">خروج از حساب</button>
            </div>
        </div>
    </div>

    <!-- Voice Status Overlay -->
    <div id="vs" class="voice-status">
        <div style="font-size:30px;margin-bottom:10px">🎙️</div>
        <div id="vt">در حال گوش دادن...</div>
    </div>

    <!-- Group Link Modal -->
    <div id="gm" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--accent)">لینک دعوت گروه</h3>
            <p style="font-size:12px;color:#888">این لینک را برای دوستانت بفرست:</p>
            <div class="link-box" id="gl"></div>
            <button onclick="copyLink()">کپی لینک</button>
            <button class="sec" onclick="closeModal()" style="margin-top:10px">بستن</button>
        </div>
    </div>

<script>
    // تنظیمات API مستقیم (بدون نیاز به دانلود کتابخانه)
    const URL = 'https://lzlubkybrzkomjefqwxk.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6bHVia3licnprb21qZWZxd3hrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MjgyODIsImV4cCI6MjEwNTMwNDI4Mn0.txxWNKJfffkE7quUKJ4v2E6EiotRHFrWDRTKVa9TYPs';
    const HEADERS = {
        'apikey': KEY,
        'Authorization': `Bearer ${KEY}`,
        'Content-Type': 'application/json'
    };
    
    let me = null, target = null, targetType = null;
    const BASE_URL = 'https://karensite.github.io/';
    let recognition;

    // توابع کمکی API
    async function apiGet(table, query = '') {
        const res = await fetch(`${URL}/rest/v1/${table}?${query}`, { headers: HEADERS });
        return res.json();
    }

    async function apiPost(table, data) {
        await fetch(`${URL}/rest/v1/${table}`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(data)
        });
    }

    async function apiDelete(table, col, val) {
        await fetch(`${URL}/rest/v1/${table}?${col}=eq.${val}`, {
            method: 'DELETE',
            headers: HEADERS
        });
    }

    // Load contacts from LocalStorage
    function getContacts() {
        return JSON.parse(localStorage.getItem('my_contacts') || '[]');
    }

    function saveContact(name, type) {
        let contacts = getContacts();
        if(!contacts.find(c => c.name === name)) {
            contacts.push({ name, type });
            localStorage.setItem('my_contacts', JSON.stringify(contacts));
        }
        renderContacts();
    }

    function renderContacts() {
        const list = document.getElementById('cl');
        list.innerHTML = '';
        getContacts().forEach(c => {
            const icon = c.type === 'group' ? '#' : c.name[0].toUpperCase();
            const typeText = c.type === 'group' ? 'گروه' : 'کاربر';
            list.innerHTML += `<div class="list-item" onclick="openChat('${c.name}', '${c.type}')">
                <div class="avatar">${icon}</div>
                <div class="info"><h4>${c.name}</h4><p>${typeText}</p></div>
            </div>`;
        });
    }

    async function login() {
        const u = document.getElementById('lu').value.trim();
        const p = document.getElementById('lpw').value;
        if(!u || !p) return document.getElementById('le').innerText = 'اطلاعات ناقص است';
        
        try {
            const blocked = await apiGet('Blocked_users', `username=eq.${u}`);
            if(blocked && blocked.length > 0) return document.getElementById('le').innerText = 'حساب شما مسدود شده است';
        } catch(e) {}

        me = u;
        document.getElementById('lp').classList.remove('active');
        document.getElementById('cp').classList.add('active');
        document.getElementById('acc-name').innerText = u;
        document.getElementById('acc-avatar').innerText = u[0].toUpperCase();
        
        renderContacts();
        checkUrlParams();
        initVoice();
    }

    function showAccount() {
        document.getElementById('cp').classList.remove('active');
        document.getElementById('ap').classList.add('active');
    }

    function backToChat() {
        document.getElementById('ap').classList.remove('active');
        document.getElementById('cp').classList.add('active');
    }

    function clearContacts() {
        if(confirm('آیا مطمئنی؟ همه مخاطبین پاک می‌شوند.')) {
            localStorage.removeItem('my_contacts');
            renderContacts();
        }
    }

    function logout() { location.reload(); }

    async function handleSearch() {
        const q = document.getElementById('si').value.trim();
        if(!q) return;
        
        if(q.startsWith('#')) {
            const name = q.substring(1);
            if(name) openChat(name, 'group');
            return;
        }

        const data = await apiGet('Karensite', `fram_id=eq.${q}&limit=1`);
        if(data && data.length > 0) {
            saveContact(q, 'private');
        } else {
            alert('کاربر یافت نشد.');
        }
    }

    function openChat(id, type) {
        target = id;
        targetType = type;
        saveContact(id, type);
        
        document.getElementById('ht').innerText = type === 'group' ? `گروه: ${id}` : `چت با: ${id}`;
        document.getElementById('mi').disabled = false;
        document.getElementById('sb').disabled = false;
        
        if(type === 'group') {
            document.getElementById('ht').innerHTML = `گروه: ${id} <button class="icon-btn" onclick="showGroupLink('${id}')" style="font-size:14px;margin-right:10px">🔗</button>`;
        }
        
        loadMessages();
    }

    function showGroupLink(name) {
        const link = `${BASE_URL}?group=${encodeURIComponent(name)}`;
        document.getElementById('gl').innerText = link;
        document.getElementById('gm').style.display = 'flex';
    }

    function copyLink() {
        const text = document.getElementById('gl').innerText;
        navigator.clipboard.writeText(text).then(() => alert('لینک کپی شد!'));
    }

    function closeModal() { document.getElementById('gm').style.display = 'none'; }

    function checkUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const group = urlParams.get('group');
        if(group) {
            openChat(decodeURIComponent(group), 'group');
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    }

    async function loadMessages() {
        if(!target) return;
        const data = await apiGet('Karensite', `or=(and(fram_id.eq.${me},To_id.eq.${target}),and(fram_id.eq.${target},To_id.eq.${me}))&order=Id.asc&limit=50`);
        
        const c = document.getElementById('mc');
        c.innerHTML = '';
        data.forEach(m => {
            const d = document.createElement('div');
            d.className = `msg ${m.fram_id === me ? 'sent' : 'rcv'}`;
            d.innerHTML = targetType === 'group' ? `<span class="msg-sender">${m.fram_id}</span>${m.Content}` : m.Content;
            
            if(m.fram_id === me) {
                let timer;
                d.addEventListener('touchstart', () => { timer = setTimeout(() => deleteMsg(m.Id), 800); });
                d.addEventListener('mousedown', () => { timer = setTimeout(() => deleteMsg(m.Id), 800); });
                d.addEventListener('touchend', () => clearTimeout(timer));
                d.addEventListener('mouseup', () => clearTimeout(timer));
            }
            c.appendChild(d);
        });
        c.scrollTop = c.scrollHeight;
    }

    // پاکسازی خودکار پیام‌های قدیمی
    async function cleanOldMessages() {
        if(!target) return;
        const { count } = await apiGet('Karensite', `or=(and(fram_id.eq.${me},To_id.eq.${target}),and(fram_id.eq.${target},To_id.eq.${me}))&limit=1`);
        // Note: Head count needs specific API call, simplified here for demo
        // In real app, use count: 'exact' in supabase-js or custom endpoint
    }

    async function send() {
        const i = document.getElementById('mi');
        if(!i.value.trim() || !target) return;
        
        await apiPost('Karensite', [{ fram_id: me, To_id: target, Content: i.value, Type: targetType }]);
        i.value = '';
        loadMessages();
        
        // پاکسازی هوشمند (حذف پیام‌های خیلی قدیمی اگر تعداد زیاد شد)
        const allMsgs = await apiGet('Karensite', `or=(and(fram_id.eq.${me},To_id.eq.${target}),and(fram_id.eq.${target},To_id.eq.${me}))&order=Id.asc`);
        if(allMsgs.length > 50) {
            const toDelete = allMsgs[0].Id;
            apiDelete('Karensite', 'Id', toDelete);
        }
    }

    async function deleteMsg(id) {
        if(confirm('این پیام حذف شود؟')) {
            await apiDelete('Karensite', 'Id', id);
            loadMessages();
        }
    }

    // --- Voice Recognition System ---
    function initVoice() {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR'; // زبان فارسی
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                document.getElementById('vb').classList.add('recording');
                document.getElementById('vs').style.display = 'block';
                document.getElementById('vt').innerText = "در حال گوش دادن...";
            };

            recognition.onend = function() {
                document.getElementById('vb').classList.remove('recording');
                document.getElementById('vs').style.display = 'none';
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('mi').value += transcript + " ";
                document.getElementById('vt').innerText = "متن دریافت شد!";
            };

            recognition.onerror = function(event) {
                document.getElementById('vt').innerText = "خطا در تشخیص صدا";
                setTimeout(() => { document.getElementById('vs').style.display = 'none'; }, 1000);
            };
        } else {
            document.getElementById('vb').style.display = 'none';
            console.log("مرورگر شما از تبدیل صدا پشتیبانی نمی‌کند.");
        }
    }

    function toggleVoice() {
        if (!recognition) return;
        try {
            recognition.start();
        } catch(e) {
            recognition.stop();
        }
    }
</script>
</body>
  </html>
