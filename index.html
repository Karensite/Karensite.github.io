<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>بازی ساده کارن</title>
<style>
  body {
    background:#111;
    color:#eee;
    font-family:sans-serif;
    text-align:center;
    padding:20px;
  }
  #game {
    width:300px;
    height:300px;
    background:#222;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:5px;
    padding:5px;
    border-radius:10px;
  }
  .cell {
    background:#333;
    font-size:40px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    border-radius:5px;
  }
  #status {
    margin-top:20px;
    font-size:20px;
  }
</style>
</head>
<body>

<h1>بازی دوز کارن (X و O)</h1>

<div id="game"></div>

<div id="status">نوبت: X</div>

<script src="web.js"></script>
</body>
</html>
